version: '3'
services:
  app:
    build: .
    volumes:
      - ".:/app"
    ports:
      - "3000:3000"
    depends_on:
      - postgres_db
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres_db:5432/project_development

  postgres_db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_development
    ports:
      - "9999:5432"
